services:
  db:
    image: postgres:16-alpine
    container_name: papeletto-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: papeletto
      POSTGRES_PASSWORD: papeletto
      POSTGRES_DB: papeletto
    volumes:
      - papeletto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papeletto -d papeletto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  papeletto_pg_data:
